<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenska SMM Command Center — Trust-First Beauty & Wellness Social Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5C0A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenska SMM">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  
  <!-- Official Zenska Typography: Work Sans (from zenska.ph) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
      });
    }
  </script>
</head>
<body>

  <!-- Topbar with Device Viewport Switcher -->
  <div class="app-topbar">
    <div class="topbar-left">
      <a href="https://zenska.ph" target="_blank" style="display: inline-flex; align-items: center; gap: 8px;">
        <img src="assets/zenska-logo.png" alt="zenska.ph" class="topbar-brand-logo">
      </a>
      <span class="topbar-subtext">| SMM Command Center</span>
      <span class="topbar-badge-verified">
        ● 320+ Verified Sellers
      </span>
    </div>

    <!-- Center: Interactive Device Simulator Switcher -->
    <div class="topbar-center">
      <span style="font-size: 11px; color: #BFA8B9; font-weight: 500;">Device Layout:</span>
      <div class="simulator-pill-group">
        <button class="sim-btn active" data-mode="auto" onclick="window.App.setDeviceMode('auto')" title="Responsive browser viewport">
          <i data-lucide="globe" style="width: 12px; height: 12px;"></i> Auto
        </button>
        <button class="sim-btn" data-mode="desktop" onclick="window.App.setDeviceMode('desktop')" title="Simulate Desktop / PC (≥1280px)">
          <i data-lucide="monitor" style="width: 12px; height: 12px;"></i> Desktop
        </button>
        <button class="sim-btn" data-mode="tablet" onclick="window.App.setDeviceMode('tablet')" title="Simulate iPad / Tablet (768-1279px)">
          <i data-lucide="tablet" style="width: 12px; height: 12px;"></i> iPad
        </button>
        <button class="sim-btn" data-mode="phone" onclick="window.App.setDeviceMode('phone')" title="Simulate Mobile Phone (≤767px)">
          <i data-lucide="smartphone" style="width: 12px; height: 12px;"></i> Phone
        </button>
      </div>
    </div>

    <!-- Right: Utility shortcuts -->
    <div class="topbar-right">
      <button class="sim-btn" id="toggle-offline-btn" title="Toggle Network Offline Tolerance Simulation">
        <i data-lucide="wifi" style="width: 13px; height: 13px;"></i> Offline
      </button>
      <button class="sim-btn" id="toggle-dark-mode-btn" title="Toggle Dark Mode Theme">
        <i data-lucide="moon" class="dark-mode-icon" style="width: 13px; height: 13px;"></i> Theme
      </button>
      <button class="sim-btn" onclick="window.App.openShortcutsModal()" title="Keyboard Shortcuts (?)">
        <i data-lucide="keyboard" style="width: 13px; height: 13px;"></i> Keys
      </button>
      <button class="sim-btn" id="reset-data-btn" title="Reset Demo Data">
        <i data-lucide="rotate-ccw" style="width: 13px; height: 13px;"></i> Reset
      </button>
    </div>
  </div>

  <!-- Outer Floating Wrapper with Ambient Glassmorphic Orbs -->
  <div class="app-outer-wrapper">
    <div class="ambient-mesh-glow ambient-plum"></div>
    <div class="ambient-mesh-glow ambient-rose"></div>
    <div class="ambient-mesh-glow ambient-gold"></div>
    
    <!-- Floating App Frame (Glassmorphic Rounded Canvas) -->
    <div class="app-frame-container glass-canvas" id="app-shell-container">
      
      <!-- Left Sleek Dark Sidebar -->
      <aside class="sidebar-intelly glass-sidebar" id="app-sidebar">
        
        <div class="sidebar-logo-row">
          <div class="logo-text-intelly">
            <img src="assets/zenska-logo.png" alt="zenska.ph" class="sidebar-brand-logo">
          </div>
          <div class="sidebar-collapse-btn" title="Collapse Sidebar" onclick="document.getElementById('app-sidebar').classList.toggle('collapsed')">
            ‹
          </div>
        </div>

        <div style="flex: 1; overflow-y: auto;">
          
          <!-- General Section -->
          <div class="sidebar-section-title">General</div>
          <ul class="sidebar-nav-list">
            <li>
              <button class="sidebar-nav-item active" data-view="home">
                <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i>
                <span>Dashboard</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="calendar">
                <i data-lucide="calendar" style="width: 16px; height: 16px;"></i>
                <span>Schedule & Drops</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="tasks">
                <i data-lucide="check-square" style="width: 16px; height: 16px;"></i>
                <span>Tasks & Kanban</span>
                <span class="nav-badge-pill">8</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="analytics">
                <i data-lucide="pie-chart" style="width: 16px; height: 16px;"></i>
                <span>Statistics & reports</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="inbox">
                <i data-lucide="shield-alert" style="width: 16px; height: 16px;"></i>
                <span>Authenticity & DMs</span>
                <span class="nav-badge-pill" style="background:#EF4444; color:#FFF;">2🚩</span>
              </button>
            </li>
          </ul>

          <!-- Tools Section -->
          <div class="sidebar-section-title">Tools & Creative</div>
          <ul class="sidebar-nav-list">
            <li>
              <button class="sidebar-nav-item" data-view="influencers">
                <i data-lucide="users" style="width: 16px; height: 16px;"></i>
                <span>Influencer CRM</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="media">
                <i data-lucide="image" style="width: 16px; height: 16px;"></i>
                <span>Media Library</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="accounts">
                <i data-lucide="link-2" style="width: 16px; height: 16px;"></i>
                <span>Connected Channels</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="library">
                <i data-lucide="bookmark" style="width: 16px; height: 16px;"></i>
                <span>Hashtag & Captions</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="campaigns">
                <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
                <span>Campaigns</span>
              </button>
            </li>
            <li>
              <button class="sidebar-nav-item" data-view="competitor">
                <i data-lucide="compass" style="width: 16px; height: 16px;"></i>
                <span>Competitor Watch</span>
              </button>
            </li>
          </ul>

        </div>

        <!-- Sidebar Footer -->
        <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; font-size: 11px;">
          <div style="color: #7A6574; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px;">Zenska Trust Engine</div>
          <div style="color: #D4BDCC; font-weight: 600;">12,000+ Authenticated SKUs</div>
          <div style="color: #34D399; font-weight: 700; margin-top: 2px;">4.9★ Customer Rating</div>
        </div>

      </aside>

      <!-- Center Main Content Area -->
      <main class="main-center-content" id="view-root">
        <!-- Views render here -->
      </main>

      <!-- Right Mini Calendar & Today's Timeline Sidebar -->
      <aside class="sidebar-right-calendar glass-right-sidebar" id="intelly-right-sidebar">
        <!-- Rendered by HomeView -->
      </aside>

    </div>

  </div>

  <!-- Mobile Floating Action Button (FAB) -->
  <button class="fab-quick-add" onclick="window.App.openQuickAddModal()" title="Quick Add Task or Post">
    <i data-lucide="plus" style="width: 24px; height: 24px;"></i>
  </button>

  <!-- Mobile Purpose-Built Bottom Tab Bar (≤767px) -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-grid">
      <button class="mobile-nav-btn active" data-view="home">
        <i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i>
        <span>Dashboard</span>
      </button>
      <button class="mobile-nav-btn" data-view="calendar">
        <i data-lucide="calendar" style="width: 18px; height: 18px;"></i>
        <span>Schedule</span>
      </button>
      <button class="mobile-nav-btn" onclick="window.App.openCreatePostModal()">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--zenska-plum); color: #FFF; display: flex; align-items: center; justify-content: center; margin-top: -12px; box-shadow: 0 4px 10px rgba(92,10,63,0.3);">
          <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
        </div>
        <span style="margin-top: 2px;">Create</span>
      </button>
      <button class="mobile-nav-btn" data-view="analytics">
        <i data-lucide="pie-chart" style="width: 18px; height: 18px;"></i>
        <span>Analytics</span>
      </button>
      <button class="mobile-nav-btn" data-view="inbox">
        <i data-lucide="shield-alert" style="width: 18px; height: 18px;"></i>
        <span>Inbox</span>
      </button>
    </div>
  </nav>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/preview.js"></script>
  <script src="js/views/media.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/inbox.js"></script>
  <script src="js/views/influencers.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/campaigns.js"></script>
  <script src="js/views/competitor.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
